
name: Daily Property Search 8.14

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          # Pin the runner to Ubuntu 24.04. GitHub's ubuntu-latest can move to
          # a newer Ubuntu release before the installed Playwright version supports it.
          python -m playwright install --with-deps chromium

      - name: Run property search
        run: python search.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit state
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json price_history.json candidate_history.json diagnostics.json official_db.json
          git diff --cached --quiet && echo "No state changes" || git commit -m "update property search state"

      - name: Push state
        run: git push
